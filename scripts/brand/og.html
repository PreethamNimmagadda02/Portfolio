<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Geist+Mono:wght@400&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; border-radius: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0C0A08; position: relative;
    -webkit-font-smoothing: antialiased;
  }
  .rule {
    position: absolute; left: 96px; right: 96px; top: 96px;
    height: 1px; background: rgba(201,169,97,0.45);
  }
  .name {
    position: absolute; left: 96px; top: 160px; margin: 0;
    font-family: "Bodoni Moda", "Bodoni 72", Didot, serif;
    font-optical-sizing: none; font-variation-settings: "opsz" 22; font-weight: 400; font-style: normal;
    font-size: 84px; line-height: 1.04; letter-spacing: -0.01em;
    color: #F2ECE0; white-space: nowrap;
  }
  .thesis {
    position: absolute; left: 96px; top: 290px; margin: 0;
    font-family: "Bodoni Moda", "Bodoni 72", Didot, serif;
    font-optical-sizing: none; font-variation-settings: "opsz" 22; font-weight: 400; font-style: italic;
    font-size: 44px; line-height: 1.2;
    color: #B8AE9C; white-space: nowrap;
  }
  .eyebrow {
    position: absolute; left: 96px; bottom: 96px; margin: 0;
    font-family: "Geist Mono", ui-monospace, Menlo, monospace;
    font-weight: 400; font-size: 20px; line-height: 1;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: #B8AE9C; white-space: nowrap;
    display: flex; align-items: center; gap: 18px;
  }
  /* The gold detent the hero sets before its eyebrow. */
  .mark {
    display: block; width: 9px; height: 9px;
    background: #C9A961; transform: rotate(45deg);
  }
</style>
</head>
<body>
  <div class="rule"></div>
  <h1 class="name">Preetham Nimmagadda</h1>
  <p class="thesis">Architecting intelligence that acts.</p>
  <p class="eyebrow"><span class="mark"></span>AI ARCHITECT, AUTONOMOUS SYSTEMS</p>
</body>
</html>
