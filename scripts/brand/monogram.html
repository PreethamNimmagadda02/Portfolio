<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PN monogram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&display=block" rel="stylesheet">
<style>
  /* Source of truth for the PN mark used as the favicon, the PWA icon and the
     iOS home screen icon. Rasterise with any headless browser at the sizes
     listed in scripts/brand/README.md, using a square viewport: every length
     here is a share of the canvas, so all sizes are the same drawing.

     Weight 700 rather than the letterhead's 400 everywhere: a favicon is drawn
     at 16 to 32 device pixels, where a Didone's hairlines fall below a single
     pixel. The earlier 400 mark lost the entire N in the browser tab.

     The gold frame is the one thing that is not size independent, and it is
     gated below on purpose. At 16 to 32 device pixels an inset hairline is the
     same order of magnitude as the letters, so it crowds the mark and reads as
     noise; at 192 and 512 it is the plate edge the whole site is built on. */
  html, body { margin: 0; padding: 0; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #0C0A08;
    -webkit-font-smoothing: antialiased;
  }
  .mono {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: "Bodoni Moda", "Bodoni 72", Didot, serif;
    /* Optical size pinned to match the site, which is also what keeps the
       hairlines of the N above one device pixel at tab sizes. Tracking it
       to a 60vw type size selects the print master and thins them. */
    font-optical-sizing: none; font-variation-settings: "opsz" 22;
    font-weight: 700;
    font-size: 60vw;
    line-height: 1;
    letter-spacing: -0.005em;
    color: #F2ECE0;
    /* Cap-height glyphs sit low in the em box; lift them onto the optical centre. */
    padding-bottom: 3vw;
    box-sizing: border-box;
  }
  /* The plate edge, in the site's hairline gold. Rendered only from 64px up,
     so favicon-16 and favicon-32 stay the bare mark. */
  .frame { display: none; }
  @media (min-width: 64px) {
    .frame {
      display: block;
      position: absolute; inset: 7.8%;
      /* max() holds the rule at a full device pixel once the proportional
         width would round to a fraction: 2px at 512, 1px at 192. */
      border: max(1px, 0.39vw) solid rgba(201, 169, 97, 0.45);
    }
    /* Give the letters air inside the frame rather than letting the P and the
       N crowd the rule. */
    .mono { font-size: 50vw; padding-bottom: 2.5vw; }
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="mono">PN</div>
</body>
</html>
